<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Tutorial</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .test-button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
        }
        .test-button:hover {
            background: #0056b3;
        }
        .status {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>🔧 Teste do Tutorial</h1>
    
    <div class="status">
        <h3>Status do Sistema:</h3>
        <p><strong>Localização atual:</strong> <span id="current-url"></span></p>
        <p><strong>Arquivo ../CHECKLIST ACADEMICO/tutorial.html:</strong> <span id="tutorial-status">Verificando...</span></p>
        <p><strong>localStorage tutorial_accessed:</strong> <span id="localstorage-status">Verificando...</span></p>
    </div>

    <h3>Ações de Teste:</h3>
    <button class="test-button" onclick="testRedirect()">🚀 Testar Redirecionamento</button>
    <button class="test-button" onclick="clearTutorialAccess()">🗑️ Limpar Tutorial Access</button>
    <button class="test-button" onclick="checkTutorialFile()">📁 Verificar Arquivo Tutorial</button>
    
    <div id="console-output" style="background: #f8f9fa; padding: 10px; border-radius: 5px; margin-top: 20px; font-family: monospace; max-height: 300px; overflow-y: auto;">
        <h4>📜 Console de Teste:</h4>
        <div id="console-log"></div>
    </div>

    <script>
        function log(message) {
            const consoleLog = document.getElementById('console-log');
            const timestamp = new Date().toLocaleTimeString();
            consoleLog.innerHTML += `[${timestamp}] ${message}<br>`;
            console.log(`[${timestamp}] ${message}`);
        }

        function updateStatus() {
            document.getElementById('current-url').textContent = window.location.href;
            
            const tutorialAccess = localStorage.getItem('tutorial_accessed');
            document.getElementById('localstorage-status').textContent = tutorialAccess ? '✅ Já acessado' : '❌ Não acessado';
            
            log('📊 Status atualizado');
        }

        async function checkTutorialFile() {
            log('🔍 Verificando arquivo ../CHECKLIST ACADEMICO/tutorial.html...');
            try {
                const response = await fetch('../CHECKLIST ACADEMICO/tutorial.html');
                const status = response.ok ? '✅ Encontrado' : `❌ Erro ${response.status}`;
                document.getElementById('tutorial-status').textContent = status;
                log(`Arquivo ../CHECKLIST ACADEMICO/tutorial.html: ${status}`);
            } catch (error) {
                document.getElementById('tutorial-status').textContent = '❌ Erro de rede';
                log(`Erro ao verificar ../CHECKLIST ACADEMICO/tutorial.html: ${error.message}`);
            }
        }

        function testRedirect() {
            log('🚀 Testando redirecionamento...');
            const tutorialAccess = localStorage.getItem('tutorial_accessed');
            
            if (!tutorialAccess) {
                log('Primeiro acesso - redirecionando para ../CHECKLIST ACADEMICO/tutorial.html');
                window.location.href = '../CHECKLIST ACADEMICO/tutorial.html';
            } else {
                log('Tutorial já acessado - mostrando modal do checklist');
                alert('Tutorial já foi acessado anteriormente!');
            }
        }

        function clearTutorialAccess() {
            localStorage.removeItem('tutorial_accessed');
            log('🗑️ Tutorial access removido do localStorage');
            updateStatus();
        }

        // Inicializar
        window.addEventListener('load', function() {
            log('🚀 Página de teste carregada');
            updateStatus();
            checkTutorialFile();
        });

        // Monitorar mudanças no localStorage
        window.addEventListener('storage', function(e) {
            if (e.key === 'tutorial_accessed') {
                log('🔄 Tutorial access mudou no localStorage');
                updateStatus();
            }
        });
    </script>
</body>
</html>
