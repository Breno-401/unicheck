<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>QA responsivo — Configurações de Perfil</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 24px; background: #e8edf3; font-family: system-ui, sans-serif; }
        h1 { margin-top: 0; }
        .cases { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 24px; }
        .case { padding: 12px; border-radius: 12px; background: #fff; box-shadow: 0 8px 24px rgba(0,0,0,.08); }
        .case h2 { margin: 0 0 8px; font-size: 14px; }
        iframe { display: block; border: 1px solid #9aa6b2; background: #fff; }
    </style>
</head>
<body>
    <h1>Configurações de Perfil — breakpoints</h1>
    <div class="cases">
        <section class="case"><h2>320 px</h2><iframe title="Perfil em 320px" data-profile-preview width="320" height="760" sandbox="allow-same-origin"></iframe></section>
        <section class="case"><h2>390 px</h2><iframe title="Perfil em 390px" data-profile-preview width="390" height="760" sandbox="allow-same-origin"></iframe></section>
        <section class="case"><h2>768 px</h2><iframe title="Perfil em 768px" data-profile-preview width="768" height="760" sandbox="allow-same-origin"></iframe></section>
        <section class="case"><h2>1024 px</h2><iframe title="Perfil em 1024px" data-profile-preview width="1024" height="760" sandbox="allow-same-origin"></iframe></section>
    </div>
    <script>
        var rawBase = "https://raw.githubusercontent.com/" +
            "Breno-401/unicheck/chore/consolidacao-repositorio-supabase/Unicheck/";
        Promise.all([
            fetch(rawBase + "platform/CONFIGURACOES%20PERFIL/configuracoes.html").then(function (response) { return response.text(); }),
            fetch(rawBase + "platform/CONFIGURACOES%20PERFIL/configuracoes.css").then(function (response) { return response.text(); })
        ]).then(function (files) {
            var markup = files[0]
                .replace(/<script[\s\S]*?<\/script>/gi, "")
                .replace(/<link rel="stylesheet" href="configuracoes\.css">/i, "")
                .replace("</head>", "<style>" + files[1] + "</style></head>");
            document.querySelectorAll("iframe[data-profile-preview]").forEach(function (frame) {
                frame.srcdoc = markup;
            });
        });
    </script>
</body>
</html>
