name: Repository integrity

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  local-references:
    name: Validate local references
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check HTML and CSS references
        run: node scripts/check-local-references.mjs
